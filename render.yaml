# Render Blueprint: the game (index.html), the Map Forge (forge.html) and the spell bench
# (spellfx.html) as one static site. `vite build` writes everything to dist/: hashed bundles and
# maps in dist/assets, and public/ (models, music, sounds) copied as is.
services:
  - type: web
    runtime: static
    name: warborne
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      # Pages: always revalidate so a new deploy shows up at once.
      - path: /*.html
        name: Cache-Control
        value: no-cache
      - path: /
        name: Cache-Control
        value: no-cache
      # Content-hashed bundles and maps never change under the same name.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Models, music and sounds keep their names across deploys: cache a day, then revalidate.
      - path: /models/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /music/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
      - path: /sounds/*
        name: Cache-Control
        value: public, max-age=86400, stale-while-revalidate=604800
